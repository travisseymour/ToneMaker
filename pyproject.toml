[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tonemaker"
version = "2026.5.11.1"
description = "Tool for generating sound files based on pure tone specifications."
authors = [{ name = "Travis L. Seymour, PhD", email = "nogard@ucsc.edu" }]
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
keywords = ["tool", "sound", "audio"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Topic :: Utilities",
    "Topic :: Education",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "build>=1.0",
    "check-manifest>=0.49",
]

[project.scripts]
tonemaker = "tonemaker.__main__:main"

[project.urls]
Homepage = "https://github.com/travisseymour/ToneMaker"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["F821", "F841", "E722"]  # undefined name, assigned but unused variable, bare except
